[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-capacity-guard"
version = "0.1.0"
description = "Resume local Codex conversations after model capacity errors, without switching models."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ChenCJ-io"}]
readme = "README.md"
dependencies = []

[project.scripts]
codex-capacity-guard = "capacity_guard.cli:main"

[tool.setuptools.packages.find]
include = ["capacity_guard*"]
